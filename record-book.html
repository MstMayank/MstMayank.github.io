<nav class="tool-links" aria-label="Cricket tools"><a href="record-book.html" aria-current="page">Record Book</a><a href="ipl-lens.html">IPL Lens</a></nav><h1 class="tool-heading">Cricket<br><span>Record Book</span></h1>
<div class="filters tool-filter">
  <label>Player name<input type="search" id="query" placeholder="e.g. Virat Kohli"></label>
  <label>Year<select id="year"><option value="">All years</option></select></label>
  <label>Format<select id="format"><option value="all">All international formats</option><option>Test</option><option>ODI</option><option>T20I</option><option value="T20">Other T20</option></select></label>
  <label>Category<select id="category"><option>Batting</option><option>Bowling</option><option>Team totals</option></select></label>
</div>
<p class="tool-count" id="status" role="status"></p>
<div class="table tool-table">
  <table>
    <thead><tr><th scope="col">Player or team</th><th scope="col" id="metric">Runs</th><th scope="col">Team</th><th scope="col">Opponent</th><th scope="col">Date</th><th scope="col">Competition</th></tr></thead>
    <tbody id="results"></tbody>
  </table>
</div>
<button id="more" type="button" hidden>Show more</button>
</main>
<script>
  const format = document.getElementById('format');
  const category = document.getElementById('category');
  const query = document.getElementById('query');
  const year = document.getElementById('year');
  const initialQuery = new URLSearchParams(location.search).get('q') || '';
  const legacyQuery = initialQuery.match(/^(.+?)\s+(?:in\s+)?(\d{4})$/i);
  query.value = legacyQuery ? legacyQuery[1] : initialQuery;
  const playerNames = new Map([['H Kaur', 'Harmanpreet Kaur'], ['V Kohli', 'Virat Kohli'], ['RG Sharma', 'Rohit Sharma'], ['SR Tendulkar', 'Sachin Tendulkar']]);
  const status = document.getElementById('status');
  const metric = document.getElementById('metric');
  const results = document.getElementById('results');
  const more = document.getElementById('more');
  const datasets = new Map();
  const archives = window.cricketArchives = new Map();
  const pending = new Map();
  const activeFormats = () => format.value === 'all' ? ['Test', 'ODI', 'T20I'] : [format.value];
  const needsData = () => activeFormats().some(key => !datasets.has(key));
  let archiveVersions = {};
  let checkingVersions = false;
  let request = 0;
  let limit = 25;

  let gzipFallback;
  async function readArchive(bytes) {
    if (typeof DecompressionStream === 'function' && typeof Blob.prototype.stream === 'function') {
      try {
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
        return await new Response(stream).json();
      } catch (error) {
        // Some engines expose the stream API without working gzip support.
      }
    }
    if (!gzipFallback) {
      gzipFallback = new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js';
        script.onload = () => window.fflate ? resolve(window.fflate) : reject(new Error('Archive decoder unavailable'));
        script.onerror = reject;
        document.head.appendChild(script);
      }).catch(error => {
        gzipFallback = null;
        throw error;
      });
    }
    const decoder = await gzipFallback;
    return JSON.parse(decoder.strFromU8(decoder.gunzipSync(bytes)));
  }

  function loadDataset(key) {
    if (!pending.has(key)) {
      pending.set(key, new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = './archive-players-' + key + '.js?v=' + (archiveVersions[key] || Date.now());
        script.onload = async () => {
          try {
            const bytes = Uint8Array.from(atob(archives.get(key)), char => char.charCodeAt(0));
            datasets.set(key, await readArchive(bytes));
            archives.delete(key);
            resolve();
          } catch (error) {
            reject(error);
          }
        };
        script.onerror = reject;
        document.head.append(script);
      }).finally(() => pending.delete(key)));
    }
    return pending.get(key);
  }

  async function render() {
    const current = ++request;
    const selectedFormat = format.value;
    const terms = query.value.trim().toLowerCase().split(/\s+/).filter(term => term && term !== 'in');
    const bowling = category.value === 'Bowling';
    try {
      const requested = activeFormats();
      if (needsData()) {
        status.textContent = 'Loading match records…';
        results.replaceChildren();
        more.hidden = true;
        await Promise.all(requested.filter(key => !datasets.has(key)).map(loadDataset));
      }
      if (current !== request) return;
      const rowFormats = new WeakMap();
      const rows = requested.flatMap(key => {
        const data = datasets.get(key);
        data.rows.forEach(row => rowFormats.set(row, key));
        return data.rows;
      });
      const matches = requested.reduce((sum, key) => sum + datasets.get(key).matches, 0);
      const aliases = Object.assign({}, ...requested.map(key => datasets.get(key).aliases));
      const selectedYear = year.value || (legacyQuery && !year.dataset.ready ? legacyQuery[2] : '');
      if (year.dataset.format !== selectedFormat) {
        const years = [...new Set(rows.map(row => row[6].slice(0, 4)))].sort().reverse();
        if (selectedYear && !years.includes(selectedYear)) years.push(selectedYear);
        years.sort().reverse();
        year.replaceChildren(new Option('All years', ''), ...years.map(value => new Option(value, value)));
        year.value = selectedYear || '';
        year.dataset.format = selectedFormat;
        year.dataset.ready = 'true';
      }
      const filtered = rows.filter(row =>
        row[0] === category.value &&
        (!year.value || row[6].startsWith(year.value + '-')) &&
        (!terms.length || [row[1], playerNames.get(row[1]), ...(aliases[row[10]] || [])].some(name =>
          name && terms.every(term => name.toLowerCase().includes(term))))
      );
      const series = new Map();
      for (const row of filtered) {
        const key = row[8] ? JSON.stringify([rowFormats.get(row), row[7], row[8], row[9]]) : JSON.stringify([rowFormats.get(row), row[7], row[6], ...[row[2], row[3]].sort()]);
        if (!series.has(key)) series.set(key, []);
        series.get(key).push(row);
      }
      const groups = [...series.values()];
      for (const group of groups) group.sort((a, b) => b[6].localeCompare(a[6]));
      groups.sort((a, b) => b[0][6].localeCompare(a[0][6]));
      metric.textContent = bowling ? 'Wickets / runs' : 'Runs';
      results.replaceChildren();
      let remaining = limit;
      for (const group of groups) {
        if (!remaining) break;
        const heading = results.insertRow().insertCell();
        heading.colSpan = 6;
        heading.className = 'series-heading';
        const first = group[0];
        heading.textContent = (selectedFormat === 'all' ? rowFormats.get(first) + ' · ' : '') + (first[8] ? first[8] + (first[9] ? ' · ' + first[9] : '') : first[2] + ' vs ' + first[3] + ' · ' + first[6]);
        for (const row of group.slice(0, remaining)) {
          const tr = results.insertRow();
          for (const value of [playerNames.get(row[1]) || row[1], bowling ? row[4] + '/' + row[5] : row[4], row[2], row[3], row[6], row[8] || '—']) {
            tr.insertCell().textContent = value;
          }
          if (row[11]) {
            const source = document.createElement('a');
            source.href = row[11];
            source.textContent = 'Match scorecard';
            tr.lastElementChild.append(' · ', source);
          }
          remaining--;
        }
      }
      status.textContent = filtered.length.toLocaleString() + ' results · ' + matches.toLocaleString() + (selectedFormat === 'all' ? ' international matches' : ' matches in this format’s archive') + (groups.length ? ' · Latest record: ' + groups[0][0][6] : '');
      more.hidden = filtered.length <= limit;
    } catch {
      if (current === request) status.textContent = 'Could not load the match archive. Reload the page to try again.';
    }
  }

  document.querySelector('.filters').addEventListener('input', () => { limit = 25; render(); });
  function showMore() {
    limit += 25;
    render();
  }

  more.addEventListener('click', showMore);
  if ('IntersectionObserver' in window) {
    const observer = new IntersectionObserver(entries => {
      if (!year.value && !more.hidden && entries.some(entry => entry.isIntersecting)) {
        showMore();
      }
    });
    observer.observe(more);
  }
  async function refreshArchives() {
    if (checkingVersions || pending.size) return;
    checkingVersions = true;
    try {
      const response = await fetch('./cricket-records-status.json', {cache:'no-store'});
      if (!response.ok) throw new Error('Archive status unavailable');
      const manifest = await response.json();
      if (manifest.version !== 1 || !manifest.formats) throw new Error('Invalid archive status');
      let changed = false;
      for (const [key, info] of Object.entries(manifest.formats)) {
        if (!/^[a-f0-9]{16}$/.test(info.revision)) continue;
        if (archiveVersions[key] !== info.revision) {
          archiveVersions[key] = info.revision;
          datasets.delete(key);
          changed = true;
        }
      }
      if (changed || needsData()) render();
    } catch {
      if (needsData()) render();
    } finally {
      checkingVersions = false;
    }
  }
  refreshArchives();
  setInterval(refreshArchives, 15 * 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshArchives(); });
</script>
